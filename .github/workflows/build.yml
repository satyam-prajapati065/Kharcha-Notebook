name: Build Android Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Required Keystore & Google Services
        run: |
          mkdir -p ~/.android
          
          # Generate production release keystore with alias 'key0' and standard credentials
          keytool -genkeypair -v -keystore my-upload-key.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Satyam Prajapati, OU=KharchaNotebook, O=Developer, L=Delhi, ST=Delhi, C=IN"
          cp my-upload-key.jks app/my-upload-key.jks || true
          cp my-upload-key.jks ./release.keystore || true

          # Generate debug keystore
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ./debug.keystore || true

          # Google Services config for Kharcha Notebook
          echo '{"project_info":{"project_number":"123","project_id":"kharcha-notebook"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.aistudio.cashflow.wrtkpy"}},"api_key":[{"current_key":"AIzaSyDummy"}]}]}' > app/google-services.json

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
          STORE_PASSWORD: android
          KEY_ALIAS: key0
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-upload-key.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password=android \
            -PstorePassword=android \
            -PkeyPassword=android \
            -PkeyAlias=key0 \
            -PstoreFile=$(pwd)/my-upload-key.jks \
            -x test -x lint -x lintVitalRelease

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KharchaNotebook-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk
          
